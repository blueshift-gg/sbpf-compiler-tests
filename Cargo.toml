[package]
name = "sbpf-compiler-tests"
version = "0.1.0"
edition = "2024"

[build-dependencies]
serde_json = { workspace = true }

[workspace]
members = ["crates/harness", "programs/*"]
resolver = "2"

[dependencies]
harness = { workspace = true }
clap = { workspace = true }
function-pointer = { path = "programs/function-pointer" }
pointer-table = { path = "programs/pointer-table" }
const-rodata = { path = "programs/const-rodata" }
input-loads = { path = "programs/input-loads" }
jmp32 = { path = "programs/jmp32" }
stack-args-six = { path = "programs/stack-args-six" }
panic-text-unlikely = { path = "programs/panic-text-unlikely" }
dfe-recursive = { path = "programs/dfe-recursive" }
error-handling = { path = "programs/error-handling" }
counter = { path = "programs/counter" }

[lints]
workspace = true

[workspace.dependencies]
mollusk-svm = "=0.15.1"
harness = { path = "crates/harness" }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "8.0"
indicatif = "0.18"
log = "0.4"
jiff = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
solana-account = "4.3.2"
solana-instruction = "3.4.1"
solana-pubkey = "4.2.1"
solana-sdk-ids = "3.1.0"
solana-compiler-builtins = "0.2.0"

[workspace.lints.rust]
unexpected_cfgs = "allow"


[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
